<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:ui-monospace, monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
.contenedor{display:flex;flex-direction:column;gap:10px}
.linea{display:flex;align-items:baseline;gap:10px}
.hora{font-size:7vw;line-height:1;font-weight:400;letter-spacing:0;min-width:20vw;text-align:right}
.etq{font-size:3.5vw;opacity:0.35;letter-spacing:2px;width:7vw;text-align:left}
#signo{font-size:6vw;margin-top:28px;opacity:0.9;letter-spacing:2px}
#coords{font-size:2.2vw;margin-top:16px;opacity:0.18;letter-spacing:2px}
</style>
</head>
<body>
<div class="contenedor">
  <div class="linea"><div class="hora" id="local">--:--</div><div class="etq">HL</div></div>
  <div class="linea"><div class="hora" id="solar">--:--</div><div class="etq">HS</div></div>
  <div class="linea"><div class="hora" id="sideral">--:--</div><div class="etq">ST</div></div>
</div>
<div id="signo"></div>
<div id="coords"></div>
<script src="clock.js"></script>
</body>
</html>
